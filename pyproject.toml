[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-cinema-radar"
version = "1.0.0"
description = "Personal discovery, filtering, ranking and tracking system for cinema opportunities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Global Cinema Opportunity Radar" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "ruamel.yaml>=0.18",
  "python-dotenv>=1.0",
  "selectolax>=0.3.21",
  "trafilatura>=2.0",
  "extruct>=0.18",
  "datasketch>=1.6",
  "feedparser>=6.0",
  "dateparser>=1.2",
  "imap-tools>=1.10",
  "rapidfuzz>=3.0",
  "tzdata>=2024.1",
]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
