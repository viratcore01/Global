# ---------------------------------------------------------------------------
# Source list. This is the real moat: code is replaceable, vetted sources are not.
#
# Every source is disabled until you enable it. Replace placeholder URLs with
# real, hand-vetted sources. Keep the list in git.
#
# source types:
#   email | rss | atom | web | sitemap | telegram | searxng | wayback |
#   discord | google_alerts | demo
#
# fetch: http | curl_cffi | browser | scrapling | auto
# extractor: auto | jsonld | css | heuristic | text
# ---------------------------------------------------------------------------

sources:
- name: "Email inbox (primary)"
  type: email
  enabled: false
  tier: 1
  poll_interval_minutes: 5
  contact: "you@example.com"
  notes: >
    Dedicated Gmail account subscribed to agencies, festivals and commissions.
    Set IMAP_* in .env. The listener uses BODY.PEEK and never marks mail read.
    The folder/label is configured with IMAP_FOLDER or IMAP_LABEL_FOLDER.

- name: "Telegram public channel (replace)"
  type: telegram
  url: "https://t.me/s/REPLACE_WITH_PUBLIC_CHANNEL"
  enabled: false
  tier: 2
  poll_interval_minutes: 15
  config:
    max_pages: 3
    enqueue_external_links: true
  notes: >
    Only public channels with preview enabled. Replace the channel name.
    Private channels require Telethon and your own account; that is out of
    scope for the core build.

- name: Bollywood Auditions & Crew
  type: rss
  url: https://bollywoodauditionupdates.com/category/casting-calls/feed/
  enabled: true
  tier: 2
  poll_interval_minutes: 30
  assume_opportunity: true
  config:
    urls:
    - https://bollywoodauditionupdates.com/category/crew/feed/
  notes: Active Indian casting calls and crew notices across short films, web 
    series, and features.
- name: Deadline Hollywood (Casting)
  type: rss
  url: https://deadline.com/category/casting/feed/
  enabled: false
  tier: 2
  poll_interval_minutes: 60
  notes: >
    Industry trade coverage of casting, not casting calls. Disabled on purpose:
    it produces news headlines that no actor can apply to.
- name: "Google Alerts (my queries)"
  type: google_alerts
  url: "https://www.google.com/alerts/feeds/17602279216790391852/12339653652275347045"
  enabled: true
  tier: 2
  poll_interval_minutes: 30
  config:
    max_entries: 40
    urls:
    - "https://www.google.com/alerts/feeds/17602279216790391852/15555007301314017485"
  notes: >
    Personal Google Alerts on RSS. Nothing is scraped: Google hands you the
    feed. One alert per query; paste every feed URL here. Alerts mix news with
    real calls, so each result must pass the casting-call gate before it is
    stored as an opportunity.

- name: "SearXNG sweeps"
  type: searxng
  url: "http://127.0.0.1:8888"
  enabled: false
  tier: 3
  poll_interval_minutes: 360
  config:
    queries:
    - 'site:.in "casting call"'
    - 'site:.in "audition" actor'
    - 'site:.in "open call" actor'
    - 'site:.in "short film" submission deadline'
    - 'site:.ae "casting call"'
    - 'site:.uk "open casting call"'
    - 'site:filmfreeway.com "short film"'
    - '"casting call" Mumbai "film commission"'
    max_results_per_query: 20
    language: "en"
  notes: >
    Self-host SearXNG, enable the JSON format, and set SEARXNG_URL.
    Date filtering is done in our code because engine support varies.

- name: Bollywood Auditions (Sitemap)
  type: sitemap
  url: https://bollywoodauditionupdates.com
  enabled: true
  tier: 2
  poll_interval_minutes: 180
  config:
    include:
    - /casting-call-
    - /looking-for-
    - /audition
    exclude:
    - /tag/
    - /author/
    - /privacy
    - /login
    max_urls_per_run: 200
  notes: Watches the site sitemap for newly published audition and casting 
    posts.
- name: Acmodasi Auditions
  type: web
  url: https://www.acmodasi.in/auditions
  enabled: true
  tier: 2
  poll_interval_minutes: 180
  extractor: css
  assume_opportunity: true
  extractor_config:
    item: "div.col-xl-4"
    max_items: 40
    fields:
      title:
        selector: ".casting_card_title a"
      description:
        selector: ".casting_card_cat"
      location:
        selector: ".user_card_footer_box .col-4"
    link:
      selector: ".casting_card_title a"
      attr: href
  notes: >
    Board of active Indian casting calls and auditions. One opportunity is
    extracted per card; the card copy is scored, so page-level pay or dates
    never leak into unrelated posts.
- name: "Web listing page (replace)"
  type: web
  url: "https://example.com/casting"
  enabled: false
  tier: 2
  poll_interval_minutes: 60
  extractor: auto
  config:
      # Discovery links from a listing page. If omitted, the page itself is
      # treated as one opportunity.
    link_selector: "a[href]"
    link_include:
    - "/casting/"
    - "/audition"
    - "/open-call"
    max_links: 50
  notes: "Use for an agency/board page that lists casting calls."

- name: "Source-specific CSS extractor (replace)"
  type: web
  url: "https://example.com/casting/123"
  enabled: false
  tier: 1
  poll_interval_minutes: 120
  extractor: css
  extractor_config:
    fields:
      title:
        selector: "h1"
      description:
        selector: "article"
      deadline:
        selector: ".deadline, time"
      city:
        selector: ".location"
      contact:
        selector: ".contact"
      # Optional: if the page lists several opportunities, set `item`.
      # item: "article.casting-card"
  notes: "Add one of these per hand-vetted site once you know its markup."

- name: "Wayback CDX probe (optional)"
  type: wayback
  url: "example.com"
  enabled: false
  tier: 3
  poll_interval_minutes: 1440
  config:
    patterns:
    - "casting"
    - "open-call"
    - "audition"
    max_pages: 3
  notes: "Low yield. Build it late. One request per 2 seconds, honours Retry-After."

- name: "Discord read-only bot (optional)"
  type: discord
  enabled: false
  tier: 2
  poll_interval_minutes: 5
  config:
    guild_ids: []
    channel_ids: []
  notes: >
    Only servers where an admin invited the bot. Needs the Message Content
    intent. Never use a user token.
